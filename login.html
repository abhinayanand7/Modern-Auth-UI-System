<!-- login.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="auth-container">

  <div class="auth-card">

    <h2 class="auth-title">Welcome Back</h2>

    <form id="loginForm">

      <div class="input-group">
        <input type="email" id="loginEmail" required>
        <label>Email Address</label>
      </div>

      <div class="input-group password-box">
        <input type="password" id="loginPassword" required>
        <label>Enter Password</label>
        <span class="toggle-password" onclick="togglePassword('loginPassword', this)">
          <i class="fa-solid fa-eye"></i>
        </span>
      </div>

      <button type="submit" class="btn auth-btn w-100">
        Login
      </button>

      <div class="auth-links">
        <a href="forgot.html">Forgot Password?</a>
        <p>
          Don't have an account?
          <a href="register.html">Register</a>
        </p>
      </div>

    </form>

  </div>

</div>

<script src="script.js"></script>
<script>
// LOGIN VALIDATION
const loginForm = document.getElementById("loginForm");

if(loginForm){
    loginForm.addEventListener("submit", function(e){
        e.preventDefault();

        const email = document.getElementById("loginEmail").value.trim();
        const password = document.getElementById("loginPassword").value.trim();

        if(email === "" || password === ""){
            alert("Please fill in all fields.");
            return;
        }

        // Simulate a successful login
        alert("Login successful!");

        // Here you can add the code to actually log in the user, e.g., sending a request to the server
    });
}
</script>
</body>
</html>
